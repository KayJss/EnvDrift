[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envdrift"
version = "0.1.0"
description = "Detect environment configuration drift without exposing secret values."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KayJss"}]
keywords = ["dotenv", "environment", "configuration", "ci", "devtools"]

[project.scripts]
envdrift = "envdrift.cli:main"

[tool.setuptools.packages.find]
include = ["envdrift*"]
